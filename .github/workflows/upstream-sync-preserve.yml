name: Upstream Sync (Safe Automatic Merge)

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Safe merge, verify, and publish
        env:
          UPSTREAM_REPO: Ouonnki/OuonnkiTV
          UPSTREAM_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          backup_tag="upstream-sync-backup-${GITHUB_RUN_ID}"
          git tag "${backup_tag}" HEAD
          git push origin "${backup_tag}"
          # Merge normally, then explicitly keep the fork version for every
          # conflict, including modify/delete conflicts that -X ours cannot
          # resolve by itself.
          if ! git merge --no-ff --no-commit -X ours \"upstream/${UPSTREAM_BRANCH}\"; then\n            echo \"Merge conflicts detected; preserving fork files.\" >&2\n            while IFS= read -r path; do\n              git checkout --ours -- \"$path\" 2>/dev/null || git rm -f -- \"$path\"\n              git add -A -- \"$path\"\n            done < <(git diff --name-only --diff-filter=U)\n          fi\n          git commit --no-edit -m \"chore: sync upstream ${UPSTREAM_BRANCH} while preserving fork changes\"\n          if [ -f package.json ]; then
            if node -e 'const p=require("./package.json");process.exit(p.scripts?.test?0:1)' 2>/dev/null; then npm test --if-present; fi
            if node -e 'const p=require("./package.json");process.exit(p.scripts?.build?0:1)' 2>/dev/null; then npm run build --if-present; fi
          fi
          if [ -f bun.lockb ] || [ -f bun.lock ]; then
            command -v bun >/dev/null && bun test || true
          fi
          git diff --check
          git push origin HEAD:main
